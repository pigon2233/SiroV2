[workspace]
members = ["runtime/siro-runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Proprietary"
rust-version = "1.97"

[workspace.dependencies]
hex = "0.4.3"
hmac = "0.12.1"
libc = "0.2.189"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
