[package]
name = "siro-monitor"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
publish = false
description = "Small Windows window that watches SIRO voice-model data preparation, corpus generation and training (read-only)."

# Its own workspace: kept out of the main SIRO runtime workspace and its lockfile.
[workspace]

[profile.release]
opt-level = 2
strip = true

[dependencies]
eframe = "0.37.0"
egui_plot = "0.38.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
