[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  arduino-libraries/ArduinoMqttClient@0.1.8
  bblanchon/ArduinoJson@7.4.2
build_flags = -D SIRO_LED_PIN=2

[env:esp32s3_n16r8]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  arduino-libraries/ArduinoMqttClient@0.1.8
  bblanchon/ArduinoJson@7.4.2
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.12.1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = -D BOARD_HAS_PSRAM -D SIRO_LED_PIN=2

; Diagnostic build: same firmware with the OLED disabled (rules the display out as PIR noise).
[env:esp32s3_n16r8_nooled]
extends = env:esp32s3_n16r8
build_flags = ${env:esp32s3_n16r8.build_flags} -D SIRO_HAS_OLED=0

; Bench build: raw GPIO5 PIR sampling only (no OLED/OTA/filtering); replaces the production
; firmware until the normal env is flashed again.
[env:pir_rawtest]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  arduino-libraries/ArduinoMqttClient@0.1.8
  bblanchon/ArduinoJson@7.4.2
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = -D BOARD_HAS_PSRAM -D SIRO_FW_VERSION=\"1.0.2\" -D SIRO_OTA_CHECK_INTERVAL_MS=120000UL
build_src_filter = -<*> +<../test_pir/pir_rawtest.cpp>

