<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1254" height="1254" viewBox="0 0 1254 1254">
<title>SIRO head grouped material study 0.1.0</title>
<desc>Original PNG layers retained. Three editable groups with non-destructive registration; not PSD or Cubism rig. Relative image references must travel with the SVG.</desc>
<g id="face_underpaint_group" inkscape:groupmode="layer" inkscape:label="01 face underpaint group"><image width="1254" height="1254" xlink:href="face-underpaint.png"/></g>
<g id="face_features_group" inkscape:groupmode="layer" inkscape:label="02 features group - registered" transform="matrix(0.587211634 -0.007278879 0.007278879 0.587211634 245.248010098 264.827017590)"><image width="1254" height="1254" xlink:href="face-features-group.png"/></g>
<g id="hair_with_clip_group" inkscape:groupmode="layer" inkscape:label="03 hair and clip group"><image width="1254" height="1254" xlink:href="hair-group.png"/></g>
<g id="reference_hidden" inkscape:groupmode="layer" inkscape:label="Reference - hidden" style="display:none"><image width="1254" height="1254" xlink:href="head-master.png"/></g>
</svg>
